name: tools-ci

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "android/**"
      - "web/**"
      - "analysis/baselines/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/tools-ci.yml"
  pull_request:
    paths:
      - "tools/**"
      - "android/**"
      - "web/**"
      - "analysis/baselines/**"
      - "include/**"
      - "src/**"
      - "tests/**"
      - "CMakeLists.txt"
      - ".github/workflows/tools-ci.yml"

jobs:
  analysis-and-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile analysis tools
        run: python -m compileall -q tools

      - name: Install oracle and scene test dependencies
        run: python -m pip install -r tests/requirements.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Package browser files and decode them on Android JVM
        run: |
          mkdir -p build-android-check
          node tests/test_game_package.mjs build-android-check/web-fixture.codpack
          javac -encoding UTF-8 -d build-android-check android/java/org/callofrecomp/GamePackage.java tests/android/GamePackageTest.java
          java -cp build-android-check org.callofrecomp.GamePackageTest build-android-check/web-fixture.codpack

      - name: Reject incompatible Android installation data
        run: |
          mkdir -p build-android-check
          javac -d build-android-check android/java/org/callofrecomp/Installation.java tests/android/InstallationTest.java
          java -cp build-android-check org.callofrecomp.InstallationTest
          javac -d build-android-check android/java/org/callofrecomp/TouchInput.java tests/android/TouchInputTest.java
          java -cp build-android-check org.callofrecomp.TouchInputTest
          javac -d build-android-check android/java/org/callofrecomp/RenderProfile.java tests/android/RenderProfileTest.java
          java -cp build-android-check org.callofrecomp.RenderProfileTest

      - name: Smoke-test analysis CLIs
        run: |
          python tools/pe_inspect.py --help >/dev/null
          python tools/pk3_inventory.py --help >/dev/null
          python tools/vm_abi_probe.py --help >/dev/null
          python tools/engine_vm_probe.py --help >/dev/null
          python tools/string_xrefs.py --help >/dev/null
          python tools/analyze_baseline.py --help >/dev/null

      - name: Configure host reconstruction tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build host reconstruction tests
        run: cmake --build build --parallel

      - name: Run host reconstruction tests
        run: ctest --test-dir build --output-on-failure
